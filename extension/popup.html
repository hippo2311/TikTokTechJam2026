<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Image Check</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="card">
    <div class="eyebrow"><span class="dot"></span> AI IMAGE CHECK</div>
    <h1>Check an image</h1>
    <p class="intro">Capture the visible page and analyze whether the image may have been generated by AI.</p>
    <button id="capture" class="primary"><span>⌘</span> Capture & check</button>
    <div class="shortcut"><span>Shortcut</span><kbd>⌃</kbd><kbd>⇧</kbd><kbd>Y</kbd></div>
    <section class="status" id="status">
      <div class="status-icon">✦</div>
      <div><strong>Ready</strong><small>No image has been analyzed yet</small></div>
    </section>
    <p class="privacy">Images are stored temporarily in the extension. Your AI detector runs through the configured backend.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
