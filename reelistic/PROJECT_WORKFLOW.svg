<svg width="1200" height="1080" viewBox="0 0 1200 1080" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, Helvetica, sans-serif">
  <title>Reelistic — Judge-facing AIGC detection workflow</title>
  <desc>Completed leakage-safe three-source preparation, balanced robust training, four-branch CLIP ensemble, source-aware selection, calibration, and one-time external evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#312E81"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity=".11"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title{font-size:31px;font-weight:800;fill:#fff}.subtitle{font-size:14px;fill:#CBD5E1}
      .section{font-size:12px;font-weight:800;letter-spacing:1.5px;fill:#64748B}
      .bt{font-size:16px;font-weight:750}.body{font-size:12px;fill:#475569}.small{font-size:10.5px;fill:#64748B}
      .metric{font-size:20px;font-weight:800}.badge{font-size:11px;font-weight:700}
      .arrow{stroke:#64748B;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.line{stroke:#94A3B8;stroke-width:1.25;fill:none}
    </style>
  </defs>
  <rect width="1200" height="1080" fill="url(#bg)"/>

  <!-- Judge summary -->
  <rect x="30" y="24" width="1140" height="112" rx="18" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="70" y="70" class="title">Reelistic — Explainable AIGC Image Detection</text>
  <text x="70" y="99" class="subtitle">Four complementary forensic views, fused per image and evaluated with strict data separation</text>
  <rect x="814" y="52" width="102" height="30" rx="15" fill="#1E40AF" stroke="#60A5FA"/><text x="865" y="71" text-anchor="middle" class="badge" fill="#DBEAFE">315M params</text>
  <rect x="928" y="52" width="98" height="30" rx="15" fill="#065F46" stroke="#34D399"/><text x="977" y="71" text-anchor="middle" class="badge" fill="#D1FAE5">&lt; 2B limit</text>
  <rect x="1038" y="52" width="94" height="30" rx="15" fill="#581C87" stroke="#C084FC"/><text x="1085" y="71" text-anchor="middle" class="badge" fill="#F3E8FF">Calibrated</text>
  <text x="973" y="105" text-anchor="middle" class="small" fill="#CBD5E1">Frozen CLIP ViT-L/14 backbone</text>

  <!-- 1 Data -->
  <text x="52" y="174" class="section">1 · DEVELOPMENT DATA — THREE INDEPENDENT SOURCES</text>
  <g filter="url(#shadow)">
    <rect x="52" y="190" width="250" height="76" rx="12" fill="#DBEAFE" stroke="#3B82F6"/>
    <text x="177" y="218" text-anchor="middle" class="bt" fill="#1E3A8A">birdy654</text><text x="177" y="240" text-anchor="middle" class="body" fill="#1E40AF">REAL + FAKE</text><text x="177" y="257" text-anchor="middle" class="small" fill="#1D4ED8">Reserved test never trains</text>
    <rect x="326" y="190" width="250" height="76" rx="12" fill="#E0E7FF" stroke="#6366F1"/>
    <text x="451" y="218" text-anchor="middle" class="bt" fill="#3730A3">SID Set</text><text x="451" y="240" text-anchor="middle" class="body" fill="#4338CA">Real + synthetic + tampered</text><text x="451" y="257" text-anchor="middle" class="small" fill="#4F46E5">Mapped to binary labels</text>
    <rect x="600" y="190" width="250" height="76" rx="12" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="725" y="218" text-anchor="middle" class="bt" fill="#92400E">WildFake</text><text x="725" y="240" text-anchor="middle" class="body" fill="#A16207">13 approved archives</text><text x="725" y="257" text-anchor="middle" class="small" fill="#B45309">Family-aware holdouts</text>
    <rect x="874" y="190" width="274" height="76" rx="12" fill="#FFF1F2" stroke="#F43F5E" stroke-dasharray="7 5"/>
    <text x="1011" y="218" text-anchor="middle" class="bt" fill="#9F1239">TEST-ONLY HOLDOUT</text><text x="1011" y="240" text-anchor="middle" class="body" fill="#BE123C">COCO REAL + DALL-E FAKE</text><text x="1011" y="257" text-anchor="middle" class="small" fill="#E11D48">Evaluated once after freeze</text>
  </g>
  <path d="M177 266V290H588M451 266V290M725 266V290H588" class="line"/><path d="M588 290V310" class="arrow"/>

  <!-- 2 Audit -->
  <text x="52" y="318" class="section">2 · IMMUTABLE AUDIT + LEAKAGE CONTROL</text>
  <g filter="url(#shadow)">
    <rect x="52" y="334" width="1096" height="94" rx="14" fill="#FFF" stroke="#94A3B8"/>
    <text x="198" y="368" text-anchor="middle" class="metric" fill="#0F766E">1,824,222</text><text x="198" y="391" text-anchor="middle" class="body">unique decodable records</text>
    <line x1="340" y1="352" x2="340" y2="410" stroke="#E2E8F0"/>
    <text x="465" y="368" text-anchor="middle" class="metric" fill="#B45309">64,540</text><text x="465" y="391" text-anchor="middle" class="body">content duplicates removed</text>
    <line x1="590" y1="352" x2="590" y2="410" stroke="#E2E8F0"/>
    <text x="705" y="368" text-anchor="middle" class="metric" fill="#BE123C">142</text><text x="705" y="391" text-anchor="middle" class="body">corrupt images excluded</text>
    <line x1="820" y1="352" x2="820" y2="410" stroke="#E2E8F0"/>
    <text x="984" y="365" text-anchor="middle" class="bt" fill="#334155">Disjoint manifests</text><text x="984" y="388" text-anchor="middle" class="body">train · validation · calibration</text><text x="984" y="408" text-anchor="middle" class="small">decode + SHA-256 + provenance</text>
  </g>
  <path d="M588 428V458" class="arrow"/>

  <!-- 3 Training -->
  <text x="52" y="466" class="section">3 · BALANCED, ROBUST TRAINING ON SOC GPU CLUSTER</text>
  <g filter="url(#shadow)">
    <rect x="52" y="482" width="350" height="82" rx="12" fill="#ECFDF5" stroke="#10B981"/>
    <text x="227" y="511" text-anchor="middle" class="bt" fill="#065F46">Hierarchical sampling</text><text x="227" y="534" text-anchor="middle" class="body" fill="#047857">source → class → generator family</text><text x="227" y="553" text-anchor="middle" class="small" fill="#059669">Stops dataset-size dominance</text>
    <rect x="425" y="482" width="350" height="82" rx="12" fill="#F3E8FF" stroke="#A855F7"/>
    <text x="600" y="511" text-anchor="middle" class="bt" fill="#6B21A8">Transformation exposure</text><text x="600" y="534" text-anchor="middle" class="body" fill="#7E22CE">resize · blur · noise · JPEG · crop · colour</text><text x="600" y="553" text-anchor="middle" class="small" fill="#9333EA">Clean images retained as anchor</text>
    <rect x="798" y="482" width="350" height="82" rx="12" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="973" y="511" text-anchor="middle" class="bt" fill="#1E3A8A">Reproducible selection</text><text x="973" y="534" text-anchor="middle" class="body" fill="#1E40AF">fixed manifests · weakest-source penalty</text><text x="973" y="553" text-anchor="middle" class="small" fill="#1D4ED8">Confirmation seeds 42, 43, 44</text>
  </g>
  <path d="M227 564V586H600M973 564V586H600" class="line"/><path d="M600 564V606" class="arrow"/>

  <!-- 4 Model -->
  <text x="52" y="614" class="section">4 · FOUR COMPLEMENTARY FORENSIC BRANCHES</text>
  <g filter="url(#shadow)">
    <rect x="52" y="630" width="248" height="88" rx="12" fill="#CCFBF1" stroke="#14B8A6"/>
    <text x="176" y="658" text-anchor="middle" class="bt" fill="#0F766E">Texture · 11.34M</text><text x="176" y="681" text-anchor="middle" class="body" fill="#0F766E">ResNet-18 on sharp patches</text><text x="176" y="701" text-anchor="middle" class="small" fill="#115E59">local surface artifacts</text>
    <rect x="318" y="630" width="248" height="88" rx="12" fill="#FFEDD5" stroke="#F97316"/>
    <text x="442" y="658" text-anchor="middle" class="bt" fill="#9A3412">Frequency · 0.24M</text><text x="442" y="681" text-anchor="middle" class="body" fill="#9A3412">Compact CNN on log FFT</text><text x="442" y="701" text-anchor="middle" class="small" fill="#C2410C">spectral generation patterns</text>
    <rect x="584" y="630" width="248" height="88" rx="12" fill="#FCE7F3" stroke="#EC4899"/>
    <text x="708" y="658" text-anchor="middle" class="bt" fill="#9D174D">Noise · 0.10M</text><text x="708" y="681" text-anchor="middle" class="body" fill="#9D174D">SRM residuals + CNN</text><text x="708" y="701" text-anchor="middle" class="small" fill="#BE185D">forensic residual evidence</text>
    <rect x="850" y="630" width="298" height="88" rx="12" fill="#E0E7FF" stroke="#6366F1"/>
    <text x="999" y="658" text-anchor="middle" class="bt" fill="#3730A3">Semantic · 303.44M</text><text x="999" y="681" text-anchor="middle" class="body" fill="#4338CA">Frozen CLIP ViT-L/14 + probe</text><text x="999" y="701" text-anchor="middle" class="small" fill="#4F46E5">cross-domain semantics</text>
  </g>
  <path d="M176 718V744H600M442 718V744M708 718V744M999 718V744H600" class="line"/><path d="M600 744V764" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="300" y="764" width="600" height="70" rx="13" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="600" y="793" text-anchor="middle" class="bt" fill="#92400E">Quality-aware soft gate · 1K parameters</text>
    <text x="600" y="817" text-anchor="middle" class="body" fill="#A16207">8 quality signals + branch disagreement → per-image weights → fused REAL / FAKE probability</text>
  </g>
  <path d="M600 834V864" class="arrow"/>

  <!-- 5 Evidence -->
  <text x="52" y="872" class="section">5 · SELECT → CALIBRATE → FREEZE → TEST ONCE</text>
  <g filter="url(#shadow)">
    <rect x="52" y="888" width="260" height="104" rx="12" fill="#DBEAFE" stroke="#3B82F6"/>
    <text x="182" y="917" text-anchor="middle" class="bt" fill="#1E3A8A">Selected seed 43</text><text x="182" y="941" text-anchor="middle" class="body" fill="#1E40AF">Source-aware validation</text><text x="182" y="961" text-anchor="middle" class="small" fill="#1D4ED8">birdy 0.9902 · SID 0.9165</text><text x="182" y="978" text-anchor="middle" class="small" fill="#1D4ED8">held-family WildFake 0.7109</text>
    <rect x="334" y="888" width="250" height="104" rx="12" fill="#DCFCE7" stroke="#22C55E"/>
    <text x="459" y="917" text-anchor="middle" class="bt" fill="#166534">Bounded calibration</text><text x="459" y="941" text-anchor="middle" class="body" fill="#15803D">Temperature 0.8975</text><text x="459" y="961" text-anchor="middle" class="small" fill="#16A34A">ECE 0.0118 → 0.0091</text><text x="459" y="978" text-anchor="middle" class="small" fill="#16A34A">separate calibration split</text>
    <rect x="606" y="888" width="250" height="104" rx="12" fill="#F3E8FF" stroke="#A855F7"/>
    <text x="731" y="917" text-anchor="middle" class="bt" fill="#6B21A8">Robustness complete</text><text x="731" y="941" text-anchor="middle" class="body" fill="#7E22CE">15 clean/corruption conditions</text><text x="731" y="961" text-anchor="middle" class="small" fill="#9333EA">branch + gate diagnostics</text><text x="731" y="978" text-anchor="middle" class="small" fill="#9333EA">three-seed confirmation</text>
    <rect x="878" y="888" width="270" height="104" rx="12" fill="#FFF1F2" stroke="#F43F5E" stroke-dasharray="7 5"/>
    <text x="1013" y="917" text-anchor="middle" class="bt" fill="#9F1239">Final test · complete</text><text x="1013" y="941" text-anchor="middle" class="body" fill="#BE123C">4,998 COCO + 8,843 DALL-E</text><text x="1013" y="961" text-anchor="middle" class="small" fill="#E11D48">ROC-AUC 0.8096 · Bal Acc 0.7064</text><text x="1013" y="978" text-anchor="middle" class="small" fill="#E11D48">zero development overlap</text>
  </g>
  <path d="M312 940H334M584 940H606M856 940H878" class="arrow"/>
  <rect x="158" y="1022" width="884" height="40" rx="12" fill="#0F172A"/>
  <text x="600" y="1047" text-anchor="middle" font-size="13" font-weight="700" fill="#F8FAFC">Output: calibrated FAKE probability · branch evidence · gate weights · image-quality indicators</text>
  <path d="M600 992V1022" class="arrow"/>
</svg>
