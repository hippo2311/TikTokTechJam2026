<svg width="1400" height="970" viewBox="0 0 1400 970" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Reelistic closed-loop application workflow</title>
  <desc id="desc">A browser capture enters FastAPI and DINOv3 inference. Predictions, images, and reviews are stored. Admin-approved examples become a curated training set for offline retraining and robustness validation. A versioned deployment returns to the DINOv3 inference box. Final test data never enters the loop.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25f4ee"/>
      <stop offset="1" stop-color="#fe2c55"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#a5b4fc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="loopArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#25f4ee" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, Helvetica, sans-serif; }
      .title { fill: #ffffff; font-size: 28px; font-weight: 800; }
      .subtitle { fill: #cbd5e1; font-size: 14px; }
      .section { fill: #94a3b8; font-size: 12px; font-weight: 800; letter-spacing: 1.6px; }
      .boxTitle { fill: #f8fafc; font-size: 15px; font-weight: 750; }
      .body { fill: #cbd5e1; font-size: 11.5px; }
      .small { fill: #94a3b8; font-size: 10px; }
      .num { font-size: 12px; font-weight: 800; }
      .flow { fill: none; stroke: #a5b4fc; stroke-width: 1.8; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .review { fill: none; stroke: #25f4ee; stroke-width: 1.7; stroke-dasharray: 6 5; marker-end: url(#loopArrow); }
      .loop { fill: none; stroke: #25f4ee; stroke-width: 2.6; marker-end: url(#loopArrow); }
    </style>
  </defs>

  <rect width="1400" height="970" fill="url(#background)"/>

  <!-- Header -->
  <rect x="40" y="24" width="1320" height="100" rx="20" fill="#12121c" stroke="#334155"/>
  <rect x="64" y="44" width="8" height="60" rx="4" fill="url(#accent)"/>
  <text x="92" y="68" class="title">Reelistic Closed-Loop Workflow</text>
  <text x="92" y="96" class="subtitle">Capture → infer → review → curate → retrain → validate → redeploy</text>
  <rect x="1130" y="44" width="190" height="38" rx="19" fill="#0f2f31" stroke="#25f4ee"/>
  <circle cx="1155" cy="63" r="5.5" fill="#25f4ee"/>
  <text x="1170" y="68" fill="#ccfbf1" font-size="12.5" font-weight="700">Human-in-the-loop</text>

  <!-- SECTION A -->
  <text x="64" y="160" class="section">A · LIVE INFERENCE PATH</text>

  <g>
    <rect x="64" y="180" width="228" height="140" rx="16" fill="#171722" stroke="#3b4253"/>
    <circle cx="94" cy="210" r="14" fill="#0f3b3c"/><text x="94" y="215" text-anchor="middle" fill="#25f4ee" class="num">1</text>
    <text x="118" y="215" class="boxTitle">Browser capture</text>
    <text x="88" y="244" class="body">Select an image region</text>
    <text x="88" y="264" class="body">on the current page.</text>
    <text x="88" y="292" class="small">PNG + source page URL</text>
  </g>

  <g>
    <rect x="325" y="180" width="228" height="140" rx="16" fill="#171722" stroke="#3b4253"/>
    <circle cx="355" cy="210" r="14" fill="#0f3b3c"/><text x="355" y="215" text-anchor="middle" fill="#25f4ee" class="num">2</text>
    <text x="379" y="215" class="boxTitle">Crop &amp; validate</text>
    <text x="349" y="244" class="body">Crop the selection and</text>
    <text x="349" y="264" class="body">verify the image input.</text>
    <text x="349" y="292" class="small">Failures marked UNREVIEWED</text>
  </g>

  <g>
    <rect x="586" y="180" width="228" height="140" rx="16" fill="#171722" stroke="#6d5fa9"/>
    <circle cx="616" cy="210" r="14" fill="#292341"/><text x="616" y="215" text-anchor="middle" fill="#c4b5fd" class="num">3</text>
    <text x="640" y="215" class="boxTitle">FastAPI service</text>
    <text x="610" y="244" class="body">Decode and normalize</text>
    <text x="610" y="264" class="body">to 3 × 224 × 224.</text>
    <text x="610" y="292" class="small">Stable POST /detect API</text>
  </g>

  <g>
    <rect x="847" y="180" width="228" height="140" rx="16" fill="#0b1220" stroke="url(#accent)" stroke-width="2.4"/>
    <text x="961" y="216" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="820">DINOv3 detector</text>
    <text x="871" y="246" class="body">Multi-scale taps:</text>
    <text x="871" y="264" class="body">layers 4, 8, and 12.</text>
    <text x="871" y="284" class="body">Logit → AI probability.</text>
    <text x="871" y="306" class="small">Active version from model registry</text>
  </g>

  <g>
    <rect x="1108" y="180" width="228" height="140" rx="16" fill="#211421" stroke="#fe2c55"/>
    <circle cx="1138" cy="210" r="14" fill="#4a1625"/><text x="1138" y="215" text-anchor="middle" fill="#fecdd3" class="num">5</text>
    <text x="1162" y="215" class="boxTitle">Result &amp; feedback</text>
    <text x="1132" y="244" class="body">AI-generated or human-made,</text>
    <text x="1132" y="264" class="body">with a confidence score.</text>
    <text x="1132" y="292" class="small">Correct / wrong / auto-confirm</text>
  </g>

  <path d="M292 250 H317" class="flow"/>
  <path d="M553 250 H578" class="flow"/>
  <path d="M814 250 H839" class="flow"/>
  <path d="M1075 250 H1100" class="flow"/>

  <!-- SECTION B -->
  <text x="64" y="360" class="section">B · STORAGE AND HUMAN REVIEW</text>

  <g>
    <rect x="64" y="380" width="380" height="140" rx="16" fill="#171722" stroke="#3b4253"/>
    <text x="88" y="416" class="boxTitle">Cloud Storage</text>
    <text x="88" y="444" class="body">Captured PNG plus event JSON,</text>
    <text x="88" y="464" class="body">stored under a shared object prefix.</text>
    <text x="88" y="492" class="small">Image URI linked to each prediction</text>
  </g>

  <g>
    <rect x="510" y="380" width="380" height="140" rx="16" fill="#171722" stroke="#3b4253"/>
    <text x="534" y="416" class="boxTitle">Prediction database</text>
    <text x="534" y="444" class="body">Prediction, confidence, actual label,</text>
    <text x="534" y="464" class="body">status, source page, and timestamp.</text>
    <text x="534" y="492" class="small">Reviewed records linked by ID</text>
  </g>

  <g>
    <rect x="956" y="380" width="380" height="140" rx="16" fill="#211421" stroke="#fe2c55"/>
    <text x="980" y="416" class="boxTitle">Admin review dashboard</text>
    <text x="980" y="444" class="body">Open the image and prediction,</text>
    <text x="980" y="464" class="body">confirm or correct the actual label.</text>
    <text x="980" y="492" class="small">Only admin-approved labels may train</text>
  </g>

  <path d="M961 320 V350 H254 V378" class="branch"/>
  <path d="M961 320 V350 H700 V378" class="branch"/>
  <path d="M1222 320 V350 H1146 V378" class="branch"/>

  <path d="M956 450 H890" class="review"/>
  <text x="923" y="440" text-anchor="middle" fill="#25f4ee" font-size="10" font-weight="700">UPDATE</text>

  <!-- SECTION C -->
  <rect x="40" y="560" width="1320" height="300" rx="20" fill="#101827" stroke="#334155"/>
  <text x="64" y="592" class="section">C · CONTROLLED LEARNING LOOP</text>
  <text x="64" y="616" fill="#f8fafc" font-size="14.5" font-weight="700">Reviewed evidence becomes training material only after approval and data controls</text>
  <text x="64" y="636" class="small">This is offline, versioned retraining — not automatic online learning from raw user feedback.</text>

  <g>
    <rect x="64" y="660" width="228" height="130" rx="15" fill="#152f34" stroke="#25f4ee"/>
    <circle cx="94" cy="688" r="13" fill="#0b4a4b"/><text x="94" y="693" text-anchor="middle" fill="#25f4ee" class="num">1</text>
    <text x="118" y="693" class="boxTitle">Approved reviews</text>
    <text x="88" y="720" class="body">Image + verified actual label</text>
    <text x="88" y="738" class="body">from the review database.</text>
    <text x="88" y="764" class="small">UNREVIEWED items stay excluded</text>
  </g>

  <g>
    <rect x="325" y="660" width="228" height="130" rx="15" fill="#171722" stroke="#a78bfa"/>
    <circle cx="355" cy="688" r="13" fill="#292341"/><text x="355" y="693" text-anchor="middle" fill="#c4b5fd" class="num">2</text>
    <text x="379" y="693" class="boxTitle">Curated dataset</text>
    <text x="349" y="720" class="body">Audit labels and formats,</text>
    <text x="349" y="738" class="body">deduplicate, isolate splits.</text>
    <text x="349" y="764" class="small">Versioned training manifest</text>
  </g>

  <g>
    <rect x="586" y="660" width="228" height="130" rx="15" fill="#171722" stroke="#fb7185"/>
    <circle cx="616" cy="688" r="13" fill="#321a25"/><text x="616" y="693" text-anchor="middle" fill="#fb7185" class="num">3</text>
    <text x="640" y="693" class="boxTitle">Offline retraining</text>
    <text x="610" y="720" class="body">Train a candidate version</text>
    <text x="610" y="738" class="body">on approved new material.</text>
    <text x="610" y="764" class="small">Frozen manifests + provenance</text>
  </g>

  <g>
    <rect x="847" y="660" width="228" height="130" rx="15" fill="#171722" stroke="#fbbf24"/>
    <circle cx="877" cy="688" r="13" fill="#4a3412"/><text x="877" y="693" text-anchor="middle" fill="#fde68a" class="num">4</text>
    <text x="901" y="693" class="boxTitle">Validation gate</text>
    <text x="871" y="720" class="body">Clean + transformation tests,</text>
    <text x="871" y="738" class="body">low-FPR regression checks.</text>
    <text x="871" y="764" class="small">Reject if criteria aren't met</text>
  </g>

  <g>
    <rect x="1108" y="660" width="228" height="130" rx="15" fill="#211421" stroke="url(#accent)" stroke-width="2.2"/>
    <circle cx="1138" cy="688" r="13" fill="#4a1625"/><text x="1138" y="693" text-anchor="middle" fill="#fecdd3" class="num">5</text>
    <text x="1162" y="693" class="boxTitle">Versioned deploy</text>
    <text x="1132" y="720" class="body">Publish checkpoint or ONNX</text>
    <text x="1132" y="738" class="body">behind the stable API.</text>
    <text x="1132" y="764" class="small">Rollback stays available</text>
  </g>

  <path d="M292 725 H317" class="review"/>
  <path d="M553 725 H578" class="review"/>
  <path d="M814 725 H839" class="review"/>
  <path d="M1075 725 H1100" class="review"/>

  <path d="M1146 520 V545 H178 V658" class="review"/>

  <!-- Loop back to inference -->
  <path d="M1336 725 H1380 V250 H1075" class="loop"/>
  <rect x="1367" y="350" width="26" height="260" rx="13" fill="#0f2f31" stroke="#25f4ee"/>
  <text x="1380" y="480" text-anchor="middle" fill="#ccfbf1" font-size="10" font-weight="800" transform="rotate(-90 1380 480)">DEPLOY VALIDATED MODEL BACK TO INFERENCE</text>

  <!-- Footer -->
  <rect x="280" y="878" width="840" height="26" rx="13" fill="#401623" stroke="#fe2c55"/>
  <text x="700" y="895" text-anchor="middle" fill="#fecdd3" font-size="10.5" font-weight="800">FINAL TEST SET NEVER ENTERS TRAINING, RETRAINING, MODEL SELECTION, CALIBRATION, OR THRESHOLD TUNING</text>

  <text x="700" y="938" text-anchor="middle" fill="#64748b" font-size="11">Google Compute Engine hosts FastAPI and DINOv3; Cloud Storage archives images and event records.</text>
</svg>
