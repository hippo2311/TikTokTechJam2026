<svg width="1200" height="820" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Reelistic application workflow</title>
  <desc id="desc">Browser capture flows through validation, cloud inference, storage, database, dashboard review, and a human feedback loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25f4ee"/>
      <stop offset="1" stop-color="#fe2c55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, Helvetica, sans-serif; }
      .title { fill: #ffffff; font-size: 34px; font-weight: 800; }
      .subtitle { fill: #cbd5e1; font-size: 15px; }
      .label { fill: #94a3b8; font-size: 12px; font-weight: 800; letter-spacing: 1.6px; }
      .boxTitle { fill: #f8fafc; font-size: 18px; font-weight: 750; }
      .body { fill: #cbd5e1; font-size: 13px; }
      .small { fill: #94a3b8; font-size: 11px; }
      .arrow { fill: none; stroke: #a5b4fc; stroke-width: 2; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #25f4ee; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="820" fill="url(#bg)"/>
  <rect x="34" y="28" width="1132" height="104" rx="22" fill="#12121c" stroke="#334155" filter="url(#shadow)"/>
  <rect x="58" y="51" width="8" height="58" rx="4" fill="url(#hero)"/>
  <text x="88" y="75" class="title">Reelistic Application Workflow</text>
  <text x="88" y="104" class="subtitle">Capture in context, infer in the cloud, and improve through reviewable human feedback</text>
  <rect x="914" y="58" width="210" height="42" rx="21" fill="#0f2f31" stroke="#25f4ee"/>
  <circle cx="940" cy="79" r="6" fill="#25f4ee"/>
  <text x="958" y="84" fill="#ccfbf1" font-size="13" font-weight="700">Human-in-the-loop</text>

  <text x="48" y="177" class="label">USER EXPERIENCE</text>
  <g filter="url(#shadow)">
    <rect x="48" y="196" width="220" height="126" rx="16" fill="#171722" stroke="#3b4253"/>
    <circle cx="80" cy="228" r="16" fill="#152f34"/><text x="80" y="234" text-anchor="middle" fill="#25f4ee" font-size="15" font-weight="800">1</text>
    <text x="108" y="233" class="boxTitle">Browser extension</text>
    <text x="72" y="267" class="body">User drags over an image</text>
    <text x="72" y="288" class="body">on the current web page.</text>
    <text x="72" y="307" class="small">Source URL stays attached</text>

    <rect x="312" y="196" width="220" height="126" rx="16" fill="#171722" stroke="#3b4253"/>
    <circle cx="344" cy="228" r="16" fill="#152f34"/><text x="344" y="234" text-anchor="middle" fill="#25f4ee" font-size="15" font-weight="800">2</text>
    <text x="372" y="233" class="boxTitle">Capture &amp; crop</text>
    <text x="336" y="267" class="body">Visible tab captured as PNG;</text>
    <text x="336" y="288" class="body">selected rectangle is cropped.</text>
    <text x="336" y="307" class="small">Minimum region is validated</text>

    <rect x="576" y="196" width="220" height="126" rx="16" fill="#171722" stroke="#3b4253"/>
    <circle cx="608" cy="228" r="16" fill="#292341"/><text x="608" y="234" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="800">3</text>
    <text x="636" y="233" class="boxTitle">FastAPI gateway</text>
    <text x="600" y="267" class="body">Decode, validate, normalize,</text>
    <text x="600" y="288" class="body">and route the image.</text>
    <text x="600" y="307" class="small">Stable POST /detect contract</text>

    <rect x="840" y="184" width="312" height="150" rx="18" fill="#111b28" stroke="url(#hero)" stroke-width="2"/>
    <rect x="860" y="204" width="272" height="34" rx="10" fill="#0b111c"/>
    <text x="996" y="227" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="800">DINOv3 detector</text>
    <text x="872" y="264" class="body">Multi-scale layers 4, 8, 12</text>
    <text x="872" y="286" class="body">AI probability + confidence</text>
    <text x="872" y="310" class="small">PyTorch checkpoint / ONNX-ready</text>
  </g>
  <path d="M268 259 H300" class="arrow"/>
  <path d="M532 259 H564" class="arrow"/>
  <path d="M796 259 H828" class="arrow"/>

  <text x="48" y="389" class="label">PERSISTENCE &amp; REVIEW</text>
  <g filter="url(#shadow)">
    <rect x="48" y="408" width="250" height="128" rx="16" fill="#171722" stroke="#3b4253"/>
    <text x="72" y="445" class="boxTitle">Result in browser</text>
    <text x="72" y="475" class="body">AI-generated / human-made</text>
    <text x="72" y="496" class="body">with confidence and feedback.</text>
    <text x="72" y="519" class="small">Auto-confirm after 10 seconds</text>

    <rect x="342" y="408" width="250" height="128" rx="16" fill="#171722" stroke="#3b4253"/>
    <text x="366" y="445" class="boxTitle">Cloud Storage</text>
    <text x="366" y="475" class="body">Captured PNG and event JSON</text>
    <text x="366" y="496" class="body">stored with a shared prefix.</text>
    <text x="366" y="519" class="small">Object URI linked from prediction</text>

    <rect x="636" y="408" width="250" height="128" rx="16" fill="#171722" stroke="#3b4253"/>
    <text x="660" y="445" class="boxTitle">Prediction database</text>
    <text x="660" y="475" class="body">Prediction, probability, review,</text>
    <text x="660" y="496" class="body">actual label, page, timestamp.</text>
    <text x="660" y="519" class="small">UNREVIEWED excluded from metrics</text>

    <rect x="930" y="396" width="222" height="152" rx="18" fill="#211421" stroke="#fe2c55"/>
    <text x="954" y="433" class="boxTitle">Admin dashboard</text>
    <text x="954" y="463" class="body">Open image and metadata</text>
    <text x="954" y="484" class="body">Filter and inspect errors</text>
    <text x="954" y="505" class="body">Edit actual label/status</text>
    <text x="954" y="529" class="small">Writes corrected review to DB</text>
  </g>
  <path d="M996 334 V362 H173 V396" class="arrow"/>
  <path d="M996 334 V374 H467 V396" class="arrow"/>
  <path d="M996 334 V386 H761 V396" class="arrow"/>
  <path d="M886 472 H918" class="arrow"/>

  <rect x="48" y="604" width="1104" height="152" rx="18" fill="#111827" stroke="#334155"/>
  <text x="76" y="638" class="label">QUALITY LOOP</text>
  <circle cx="100" cy="692" r="28" fill="#0f2f31" stroke="#25f4ee"/>
  <text x="100" y="698" text-anchor="middle" fill="#25f4ee" font-size="18" font-weight="800">H</text>
  <text x="145" y="680" class="boxTitle">Reviewable, not automatic ground truth</text>
  <text x="145" y="705" class="body">Correct and wrong reviews feed operational metrics; uncertain or failed cases stay visible as UNREVIEWED.</text>
  <text x="145" y="728" class="small">Curated feedback can support future retraining only after audit, deduplication, and split isolation.</text>
  <path d="M1041 548 V580 H100 V652" class="feedback"/>
  <path d="M298 472 H330" class="feedback"/>

  <text x="600" y="793" text-anchor="middle" fill="#64748b" font-size="11">Google Compute Engine hosts FastAPI and the model; Google Cloud Storage archives images and events.</text>
</svg>
