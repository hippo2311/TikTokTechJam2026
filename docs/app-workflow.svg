<svg width="1400" height="950" viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Reelistic closed-loop application workflow</title>
  <desc id="desc">A browser capture enters FastAPI and DINOv3 inference. Predictions, images, and reviews are stored. Admin-approved examples become a curated training set for offline retraining and robustness validation. A versioned deployment returns to the DINOv3 inference box. Final test data never enters the loop.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25f4ee"/>
      <stop offset="1" stop-color="#fe2c55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="loopArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#25f4ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, Helvetica, sans-serif; }
      .title { fill: #ffffff; font-size: 34px; font-weight: 820; }
      .subtitle { fill: #cbd5e1; font-size: 15px; }
      .section { fill: #94a3b8; font-size: 12px; font-weight: 800; letter-spacing: 1.7px; }
      .boxTitle { fill: #f8fafc; font-size: 17px; font-weight: 760; }
      .body { fill: #cbd5e1; font-size: 12px; }
      .small { fill: #94a3b8; font-size: 10.5px; }
      .number { fill: #25f4ee; font-size: 13px; font-weight: 800; }
      .flow { fill: none; stroke: #a5b4fc; stroke-width: 2; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #64748b; stroke-width: 1.7; marker-end: url(#arrow); }
      .review { fill: none; stroke: #25f4ee; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#loopArrow); }
      .loop { fill: none; stroke: #25f4ee; stroke-width: 3; marker-end: url(#loopArrow); }
    </style>
  </defs>

  <rect width="1400" height="950" fill="url(#background)"/>

  <rect x="36" y="28" width="1328" height="104" rx="22" fill="#12121c" stroke="#334155" filter="url(#shadow)"/>
  <rect x="60" y="51" width="8" height="58" rx="4" fill="url(#accent)"/>
  <text x="90" y="75" class="title">Reelistic Closed-Loop Workflow</text>
  <text x="90" y="104" class="subtitle">Capture → infer → review → curate → retrain → validate → redeploy</text>
  <rect x="1120" y="58" width="204" height="42" rx="21" fill="#0f2f31" stroke="#25f4ee"/>
  <circle cx="1147" cy="79" r="6" fill="#25f4ee"/>
  <text x="1164" y="84" fill="#ccfbf1" font-size="13" font-weight="700">Human-in-the-loop</text>

  <text x="48" y="174" class="section">A · LIVE INFERENCE PATH</text>
  <g filter="url(#shadow)">
    <rect x="48" y="194" width="210" height="132" rx="16" fill="#171722" stroke="#3b4253"/>
    <circle cx="78" cy="224" r="15" fill="#0f3b3c"/><text x="78" y="229" text-anchor="middle" class="number">1</text>
    <text x="104" y="229" class="boxTitle">Browser capture</text>
    <text x="72" y="264" class="body">Select an image region</text>
    <text x="72" y="285" class="body">on the current web page.</text>
    <text x="72" y="307" class="small">PNG + source page URL</text>

    <rect x="300" y="194" width="210" height="132" rx="16" fill="#171722" stroke="#3b4253"/>
    <circle cx="330" cy="224" r="15" fill="#0f3b3c"/><text x="330" y="229" text-anchor="middle" class="number">2</text>
    <text x="356" y="229" class="boxTitle">Crop &amp; validate</text>
    <text x="324" y="264" class="body">Crop selected rectangle</text>
    <text x="324" y="285" class="body">and verify image input.</text>
    <text x="324" y="307" class="small">Failures become UNREVIEWED</text>

    <rect x="552" y="194" width="210" height="132" rx="16" fill="#171722" stroke="#6d5fa9"/>
    <circle cx="582" cy="224" r="15" fill="#292341"/><text x="582" y="229" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="800">3</text>
    <text x="608" y="229" class="boxTitle">FastAPI service</text>
    <text x="576" y="264" class="body">Decode and normalize</text>
    <text x="576" y="285" class="body">to 3 × 224 × 224.</text>
    <text x="576" y="307" class="small">Stable POST /detect API</text>

    <rect x="804" y="178" width="286" height="164" rx="20" fill="#111b28" stroke="url(#accent)" stroke-width="2.3"/>
    <rect x="826" y="200" width="242" height="38" rx="11" fill="#090f19"/>
    <text x="947" y="225" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="820">DINOv3 detector</text>
    <text x="832" y="270" class="body">Multi-scale taps: layers 4, 8, 12</text>
    <text x="832" y="293" class="body">Logit → AI probability + confidence</text>
    <text x="832" y="318" class="small">Active version from model registry</text>

    <rect x="1132" y="194" width="220" height="132" rx="16" fill="#211421" stroke="#fe2c55"/>
    <circle cx="1162" cy="224" r="15" fill="#4a1625"/><text x="1162" y="229" text-anchor="middle" fill="#fecdd3" font-size="13" font-weight="800">5</text>
    <text x="1188" y="229" class="boxTitle">Result &amp; feedback</text>
    <text x="1156" y="264" class="body">AI-generated / human-made</text>
    <text x="1156" y="285" class="body">with confidence.</text>
    <text x="1156" y="307" class="small">Correct / wrong / auto-confirm</text>
  </g>
  <path d="M258 260 H288" class="flow"/>
  <path d="M510 260 H540" class="flow"/>
  <path d="M762 260 H792" class="flow"/>
  <path d="M1090 260 H1120" class="flow"/>

  <text x="48" y="392" class="section">B · STORAGE AND HUMAN REVIEW</text>
  <g filter="url(#shadow)">
    <rect x="376" y="412" width="246" height="132" rx="16" fill="#171722" stroke="#3b4253"/>
    <text x="402" y="447" class="boxTitle">Cloud Storage</text>
    <text x="402" y="477" class="body">Captured PNG + event JSON</text>
    <text x="402" y="498" class="body">with a shared object prefix.</text>
    <text x="402" y="523" class="small">Image URI linked to prediction</text>

    <rect x="674" y="412" width="246" height="132" rx="16" fill="#171722" stroke="#3b4253"/>
    <text x="700" y="447" class="boxTitle">Prediction database</text>
    <text x="700" y="477" class="body">Prediction, confidence, actual label,</text>
    <text x="700" y="498" class="body">status, source page, timestamp.</text>
    <text x="700" y="523" class="small">Reviewed records linked by ID</text>

    <rect x="972" y="398" width="300" height="160" rx="18" fill="#211421" stroke="#fe2c55"/>
    <text x="1000" y="435" class="boxTitle">Admin review dashboard</text>
    <text x="1000" y="468" class="body">Open image + prediction metadata</text>
    <text x="1000" y="490" class="body">Confirm or correct the actual label</text>
    <text x="1000" y="512" class="body">Write reviewed status back to database</text>
    <text x="1000" y="538" class="small">Only admin-approved labels may enter training</text>
  </g>
  <path d="M947 342 V370 H499 V400" class="branch"/>
  <path d="M947 342 V382 H797 V400" class="branch"/>
  <path d="M1242 326 V386 H1122" class="branch"/>
  <path d="M972 478 H932" class="review"/>
  <text x="939" y="465" text-anchor="middle" fill="#25f4ee" font-size="10" font-weight="700">UPDATE</text>

  <text x="48" y="616" class="section">C · CONTROLLED LEARNING LOOP</text>
  <rect x="48" y="634" width="1304" height="240" rx="20" fill="#101827" stroke="#334155"/>
  <text x="76" y="668" fill="#f8fafc" font-size="17" font-weight="760">Reviewed evidence becomes training material only after approval and data controls</text>
  <text x="76" y="691" class="small">This is offline, versioned retraining—not automatic online learning from raw user feedback.</text>

  <g filter="url(#shadow)">
    <rect x="76" y="720" width="222" height="112" rx="15" fill="#152f34" stroke="#25f4ee"/>
    <circle cx="103" cy="748" r="14" fill="#0b4a4b"/><text x="103" y="753" text-anchor="middle" class="number">1</text>
    <text x="127" y="753" class="boxTitle">Approved reviews</text>
    <text x="96" y="782" class="body">Image + verified actual label</text>
    <text x="96" y="803" class="body">from the review database.</text>
    <text x="96" y="821" class="small">UNREVIEWED remains excluded</text>

    <rect x="332" y="720" width="222" height="112" rx="15" fill="#171722" stroke="#a78bfa"/>
    <circle cx="359" cy="748" r="14" fill="#292341"/><text x="359" y="753" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="800">2</text>
    <text x="383" y="753" class="boxTitle">Curated dataset</text>
    <text x="352" y="782" class="body">Audit labels and formats</text>
    <text x="352" y="803" class="body">Deduplicate and isolate splits.</text>
    <text x="352" y="821" class="small">Versioned training manifest</text>

    <rect x="588" y="720" width="222" height="112" rx="15" fill="#171722" stroke="#fb7185"/>
    <circle cx="615" cy="748" r="14" fill="#321a25"/><text x="615" y="753" text-anchor="middle" fill="#fb7185" font-size="13" font-weight="800">3</text>
    <text x="639" y="753" class="boxTitle">Offline retraining</text>
    <text x="608" y="782" class="body">Train a candidate version</text>
    <text x="608" y="803" class="body">with approved new material.</text>
    <text x="608" y="821" class="small">Frozen manifests + provenance</text>

    <rect x="844" y="720" width="222" height="112" rx="15" fill="#171722" stroke="#fbbf24"/>
    <circle cx="871" cy="748" r="14" fill="#4a3412"/><text x="871" y="753" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="800">4</text>
    <text x="895" y="753" class="boxTitle">Validation gate</text>
    <text x="864" y="782" class="body">Clean + transformation tests</text>
    <text x="864" y="803" class="body">Low-FPR regression checks.</text>
    <text x="864" y="821" class="small">Reject if criteria are not met</text>

    <rect x="1100" y="720" width="222" height="112" rx="15" fill="#211421" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="1127" cy="748" r="14" fill="#4a1625"/><text x="1127" y="753" text-anchor="middle" fill="#fecdd3" font-size="13" font-weight="800">5</text>
    <text x="1151" y="753" class="boxTitle">Versioned deploy</text>
    <text x="1120" y="782" class="body">Publish checkpoint / ONNX</text>
    <text x="1120" y="803" class="body">behind the stable API.</text>
    <text x="1120" y="821" class="small">Rollback remains available</text>
  </g>

  <path d="M797 544 V600 H187 V708" class="review"/>
  <path d="M298 776 H320" class="review"/>
  <path d="M554 776 H576" class="review"/>
  <path d="M810 776 H832" class="review"/>
  <path d="M1066 776 H1088" class="review"/>

  <path d="M1211 720 V610 H1368 V158 H947 V166" class="loop"/>
  <rect x="1081" y="579" width="263" height="26" rx="13" fill="#0f2f31" stroke="#25f4ee"/>
  <text x="1212" y="596" text-anchor="middle" fill="#ccfbf1" font-size="10.5" font-weight="800">DEPLOY VALIDATED MODEL BACK TO INFERENCE</text>

  <rect x="317" y="850" width="766" height="24" rx="12" fill="#401623" stroke="#fe2c55"/>
  <text x="700" y="866" text-anchor="middle" fill="#fecdd3" font-size="10.5" font-weight="800">FINAL TEST SET NEVER ENTERS TRAINING, RETRAINING, MODEL SELECTION, CALIBRATION, OR THRESHOLD TUNING</text>

  <text x="700" y="922" text-anchor="middle" fill="#64748b" font-size="11">Google Compute Engine hosts FastAPI and DINOv3; Cloud Storage archives images and event records.</text>
</svg>
