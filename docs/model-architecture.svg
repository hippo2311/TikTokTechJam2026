<svg width="1400" height="980" viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Reelistic multi-scale DINOv3 architecture</title>
  <desc id="desc">Audited immutable data manifests feed a 224 pixel image into DINOv3 ViT-B/16. Layers 4, 8, and 12 each feed local patch and global CLS branches, then concatenate into a classifier and an optional training projection head.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="dino" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#25f4ee"/><stop offset="1" stop-color="#fe2c55"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Inter, Arial, Helvetica, sans-serif; }
      .title { fill: #0f172a; font-size: 34px; font-weight: 820; }
      .subtitle { fill: #475569; font-size: 14px; }
      .section { fill: #64748b; font-size: 12px; font-weight: 800; letter-spacing: 1.5px; }
      .boxTitle { fill: #0f172a; font-size: 16px; font-weight: 760; }
      .body { fill: #475569; font-size: 12px; }
      .small { fill: #64748b; font-size: 10.5px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
      .train { fill: none; stroke: #a855f7; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="980" fill="url(#bg)"/>
  <text x="54" y="62" class="title">Reelistic DINOv3: Multi-Scale Forensic Fusion</text>
  <text x="54" y="89" class="subtitle">One shared visual backbone exposes low-, mid-, and high-level evidence for robust AI-image detection</text>
  <rect x="1110" y="41" width="234" height="40" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1227" y="59" text-anchor="middle" fill="#334155" font-size="13" font-weight="750">85.7M backbone · 101.5M total</text>
  <text x="1227" y="75" text-anchor="middle" fill="#64748b" font-size="10.5">5.08% of the 2B limit</text>
  <rect x="54" y="111" width="1290" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="54" y="157" class="section">0 · IMMUTABLE AUDIT</text>
  <g filter="url(#shadow)">
    <rect x="54" y="178" width="420" height="222" rx="18" fill="#ffffff" stroke="#14b8a6"/>
    <text x="78" y="211" fill="#0f766e" font-size="18" font-weight="820">1,824,222 unique records</text>
    <text x="450" y="211" text-anchor="end" fill="#64748b" font-size="10.5" font-weight="700">FROZEN · SEED 42</text>
    <text x="78" y="238" class="body">Decode check → content SHA-256 → provenance split</text>
    <path d="M78 255 H450" stroke="#e2e8f0"/>
    <text x="78" y="281" fill="#b45309" font-size="13" font-weight="800">64,540 duplicates removed</text>
    <text x="286" y="281" fill="#be123c" font-size="13" font-weight="800">142 corrupt excluded</text>
    <text x="78" y="312" class="body">1,589,846 train · 189,040 validation</text>
    <text x="78" y="335" class="body">25,374 calibration · 19,962 reserved test</text>
    <rect x="78" y="354" width="372" height="27" rx="7" fill="#ecfeff" stroke="#99f6e4"/>
    <text x="264" y="372" text-anchor="middle" fill="#0f766e" font-size="10.5" font-weight="750">TEST GUARD · 0 development overlap · unique-content view</text>
  </g>

  <text x="54" y="435" class="section">1 · INPUT AND TRAINING VIEWS</text>
  <g filter="url(#shadow)">
    <rect x="54" y="456" width="420" height="250" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="76" y="480" width="58" height="58" rx="9" fill="#e0f2fe" stroke="#38bdf8"/>
    <path d="M82 528 L97 510 L108 521 L121 501 L128 530 Z" fill="#38bdf8" opacity="0.65"/>
    <circle cx="120" cy="493" r="6" fill="#fbbf24"/>
    <text x="151" y="497" class="boxTitle">RGB 224 × 224</text>
    <text x="151" y="519" class="small">ImageNet-normalized tensor</text>
    <path d="M273 508 H299" class="arrow"/>
    <g fill="#c7d2fe" stroke="#6366f1" stroke-width="0.7">
      <rect x="316" y="480" width="17" height="17"/><rect x="337" y="480" width="17" height="17"/><rect x="358" y="480" width="17" height="17"/><rect x="379" y="480" width="17" height="17"/>
      <rect x="316" y="501" width="17" height="17"/><rect x="337" y="501" width="17" height="17"/><rect x="358" y="501" width="17" height="17"/><rect x="379" y="501" width="17" height="17"/>
    </g>
    <text x="356" y="539" text-anchor="middle" class="small">14 × 14 patch grid</text>
    <path d="M76 560 H452" stroke="#e2e8f0"/>
    <text x="78" y="589" fill="#7e22ce" font-size="14" font-weight="800">Clean anchor + one transformed view</text>
    <text x="78" y="613" class="small">JPEG · blur · resize · noise · colour · crop · never chained</text>
    <path d="M76 633 H452" stroke="#e2e8f0"/>
    <text x="78" y="660" fill="#0369a1" font-size="14" font-weight="800">120,000/epoch × 10 · source × class balanced</text>
    <text x="78" y="683" class="small">Three development datasets · organizer reference is evaluation-only</text>
  </g>
  <path d="M474 508 H504" class="arrow"/>

  <text x="516" y="157" class="section">2 · SHARED DINOv3 ViT-B/16 BACKBONE</text>
  <g filter="url(#shadow)">
    <rect x="516" y="178" width="358" height="528" rx="22" fill="url(#dino)"/>
    <text x="695" y="217" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="820">DINOv3 ViT-B/16</text>
    <text x="695" y="241" text-anchor="middle" fill="#cbd5e1" font-size="12">Shared self-supervised visual representation</text>

    <rect x="546" y="270" width="298" height="104" rx="14" fill="#152f34" stroke="#25f4ee"/>
    <text x="570" y="300" fill="#25f4ee" font-size="17" font-weight="800">Layer 4 · low-level</text>
    <text x="570" y="326" fill="#d1fae5" font-size="12">Noise · edges · resampling traces</text>
    <text x="570" y="348" fill="#94a3b8" font-size="11">Earlier features retain image formation detail</text>

    <rect x="546" y="400" width="298" height="104" rx="14" fill="#292341" stroke="#a78bfa"/>
    <text x="570" y="430" fill="#c4b5fd" font-size="17" font-weight="800">Layer 8 · mid-level</text>
    <text x="570" y="456" fill="#ede9fe" font-size="12">Textures · repetition · regional coherence</text>
    <text x="570" y="478" fill="#94a3b8" font-size="11">Intermediate features connect nearby patches</text>

    <rect x="546" y="530" width="298" height="104" rx="14" fill="#321a25" stroke="#fe2c55"/>
    <text x="570" y="560" fill="#fb7185" font-size="17" font-weight="800">Layer 12 · high-level</text>
    <text x="570" y="586" fill="#ffe4e6" font-size="12">Semantics · lighting · physical plausibility</text>
    <text x="570" y="608" fill="#94a3b8" font-size="11">Final features capture global relationships</text>

    <text x="695" y="674" text-anchor="middle" fill="#94a3b8" font-size="11">Each tap exposes patch tokens + one CLS token</text>
  </g>
  <path d="M474 244 H504" class="arrow"/>

  <text x="920" y="157" class="section">3 · DUAL FORENSIC BRANCHES PER TAP</text>
  <g filter="url(#shadow)">
    <rect x="920" y="238" width="424" height="136" rx="16" fill="#ffffff" stroke="#5eead4"/>
    <rect x="940" y="258" width="184" height="94" rx="11" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="1032" y="284" text-anchor="middle" class="boxTitle">Patch branch</text>
    <text x="1032" y="307" text-anchor="middle" class="body">14 x 14 map → Conv 3 x 3</text>
    <text x="1032" y="328" text-anchor="middle" class="small">GELU → global pool → 512-D</text>
    <rect x="1140" y="258" width="184" height="94" rx="11" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="1232" y="284" text-anchor="middle" class="boxTitle">CLS branch</text>
    <text x="1232" y="307" text-anchor="middle" class="body">Global token → 2-layer MLP</text>
    <text x="1232" y="328" text-anchor="middle" class="small">GELU + dropout → 512-D</text>

    <rect x="920" y="400" width="424" height="136" rx="16" fill="#ffffff" stroke="#a78bfa"/>
    <rect x="940" y="420" width="184" height="94" rx="11" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="1032" y="446" text-anchor="middle" class="boxTitle">Patch branch</text>
    <text x="1032" y="469" text-anchor="middle" class="body">14 x 14 map → Conv 3 x 3</text>
    <text x="1032" y="490" text-anchor="middle" class="small">GELU → global pool → 512-D</text>
    <rect x="1140" y="420" width="184" height="94" rx="11" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="1232" y="446" text-anchor="middle" class="boxTitle">CLS branch</text>
    <text x="1232" y="469" text-anchor="middle" class="body">Global token → 2-layer MLP</text>
    <text x="1232" y="490" text-anchor="middle" class="small">GELU + dropout → 512-D</text>

    <rect x="920" y="562" width="424" height="136" rx="16" fill="#ffffff" stroke="#fb7185"/>
    <rect x="940" y="582" width="184" height="94" rx="11" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="1032" y="608" text-anchor="middle" class="boxTitle">Patch branch</text>
    <text x="1032" y="631" text-anchor="middle" class="body">14 x 14 map → Conv 3 x 3</text>
    <text x="1032" y="652" text-anchor="middle" class="small">GELU → global pool → 512-D</text>
    <rect x="1140" y="582" width="184" height="94" rx="11" fill="#fff1f2" stroke="#fb7185"/>
    <text x="1232" y="608" text-anchor="middle" class="boxTitle">CLS branch</text>
    <text x="1232" y="631" text-anchor="middle" class="body">Global token → 2-layer MLP</text>
    <text x="1232" y="652" text-anchor="middle" class="small">GELU + dropout → 512-D</text>
  </g>
  <path d="M844 322 H908" class="arrow"/>
  <path d="M844 452 H908" class="arrow"/>
  <path d="M844 582 H908" class="arrow"/>

  <text x="54" y="758" class="section">4 · LATE FUSION, OUTPUT, AND TRAINING SIGNALS</text>
  <g filter="url(#shadow)">
    <rect x="54" y="780" width="232" height="116" rx="16" fill="#ffffff" stroke="#6366f1"/>
    <text x="170" y="815" text-anchor="middle" class="boxTitle">Concatenate</text>
    <text x="170" y="843" text-anchor="middle" class="body">6 branches x 512-D</text>
    <text x="170" y="868" text-anchor="middle" fill="#4338ca" font-size="15" font-weight="800">3,072-D fused feature</text>

    <rect x="334" y="780" width="210" height="116" rx="16" fill="#ffffff" stroke="#94a3b8"/>
    <text x="439" y="815" text-anchor="middle" class="boxTitle">LayerNorm</text>
    <text x="439" y="843" text-anchor="middle" class="body">Stable fused scale</text>
    <text x="439" y="868" text-anchor="middle" class="small">Shared deployment feature</text>

    <rect x="592" y="780" width="244" height="116" rx="16" fill="#111827" stroke="#25f4ee"/>
    <text x="714" y="815" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800">Binary classifier</text>
    <text x="714" y="843" text-anchor="middle" fill="#cbd5e1" font-size="12">MLP → one logit → sigmoid</text>
    <text x="714" y="869" text-anchor="middle" fill="#25f4ee" font-size="14" font-weight="800">P(AI-generated)</text>

    <rect x="884" y="780" width="208" height="116" rx="16" fill="#ffffff" stroke="#a855f7" stroke-dasharray="7 5"/>
    <text x="988" y="815" text-anchor="middle" class="boxTitle">Projection head</text>
    <text x="988" y="843" text-anchor="middle" class="body">256-D embedding</text>
    <text x="988" y="868" text-anchor="middle" fill="#7e22ce" font-size="11" font-weight="700">TRAINING ONLY</text>

    <rect x="1140" y="780" width="204" height="116" rx="16" fill="#faf5ff" stroke="#a855f7" stroke-dasharray="7 5"/>
    <text x="1242" y="811" text-anchor="middle" class="boxTitle">Joint objective</text>
    <text x="1242" y="838" text-anchor="middle" class="body">BCE classification</text>
    <text x="1242" y="858" text-anchor="middle" class="body">JS consistency</text>
    <text x="1242" y="878" text-anchor="middle" class="body">Supervised contrastive</text>
  </g>
  <path d="M1132 698 V740 H170 V768" class="arrow"/>
  <path d="M286 838 H322" class="arrow"/>
  <path d="M544 838 H580" class="arrow"/>
  <path d="M836 838 H872" class="train"/>
  <path d="M1092 838 H1128" class="train"/>

  <rect x="54" y="930" width="1290" height="32" rx="10" fill="#0f172a"/>
  <text x="700" y="951" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Deployment: PyTorch checkpoint or ONNX opset 18 · Input image → output logit → sigmoid probability</text>
</svg>
