# Combined robustness experiment: exactly one sampled real-world transform per
# augmented view, with blur/noise sampled more often than already-robust cases.

[run]
name = "dinov3_vitb_srm_supcon_single_transform_v1"
seed = 42
notes = "Full DINOv3 ViT-B/16 fine-tuning with gated SRM residual adapter, transformation-aware SupCon, and one weighted real-world transform per view"

[data]
datasets = ["sid"]
manifest = "${AIGC_DATA_ROOT}/manifests/sid_balanced_20k_all.csv"
image_size = 224
normalization_mean = [0.485, 0.456, 0.406]
normalization_std = [0.229, 0.224, 0.225]
positive_class = "ai_generated"
train_splits = ["train"]
validation_split = "internal_val"
test_split = "test"
organizer_demo_split = "organizer_demo"
allow_organizer_demo_for_training = false
balance_classes_per_batch = true
balance_datasets = false
training_augmentation = "single_transform"

[model]
backbone = "facebook/dinov3-vitb16-pretrain-lvd1689m"
architecture = "dinov3_vit_b_16_srm_gated"
parameter_budget = 2_000_000_000
patch_size = 16
tapped_layers = [4, 8, 12]
freeze_backbone = false
gradient_checkpointing = true

[forensic_head]
local_aggregation_kernel = 3
local_aggregation_padding = 1
local_feature_dim = 512
classifier_hidden_dim = 512
classifier_dropout = 0.2
projection_hidden_dim = 512
projection_output_dim = 256
residual_adapter_enabled = true
residual_feature_dim = 256
residual_gate_hidden_dim = 256

[loss]
classification = "bce_with_logits"
consistency = "none"
consistency_weight = 0.0
prediction_consistency = "binary_js_divergence"
prediction_consistency_weight = 0.5
supcon = "supervised_contrastive"
supcon_weight = 0.1
supcon_temperature = 0.1

[optimizer]
name = "adamw"
learning_rate = 2e-4
backbone_learning_rate = 1e-5
weight_decay = 0.05
gradient_clip_norm = 1.0
ema_decay = 0.999

[scheduler]
name = "cosine_annealing"
warmup_epochs = 2
min_learning_rate = 1e-6

[training]
epochs = 10
batch_size = 16
gradient_accumulation_steps = 4
effective_batch_size = 64
num_workers = 2
mixed_precision = "fp16"
label_smoothing = 0.05
save_every_epoch = true

[metrics]
primary_checkpoint_metric = "tpr_at_1_fpr"
primary_checkpoint_mode = "max"
report_every_epochs = 1
track = ["train_loss", "train_prediction_consistency_loss", "train_supcon_loss", "residual_gate_mean", "internal_val_loss", "internal_val_accuracy", "roc_auc", "tpr_at_1_fpr", "fpr_at_99_tpr"]

[logging]
tensorboard = true
jsonl = true
csv = true
console = true
batch_log_every_steps = 1

[checkpointing]
enabled = true
root = "${AIGC_CHECKPOINT_ROOT}"
run_directory_template = "{started_at}_{model}_{run_name}"
monitor = "tpr_at_1_fpr"
mode = "max"
save_last = true
save_primary_best = true
include_optimizer_state = true
include_scheduler_state = true

[checkpointing.tracked_metric_modes]
tpr_at_1_fpr = "max"
fpr_at_99_tpr = "min"

[curriculum.stage1]
epochs = [0, 3]
name = "single_transform_easy"
jpeg_quality = [90]
gaussian_blur_sigma = [0.5, 1.0]
resize_scale = [0.5]
gaussian_noise_sigma = [0.02, 0.05]
center_crop_fraction = [0.8]
color_jitter_strength = [0.1]

[curriculum.stage1.transform_weights]
jpeg = 0.10
gaussian_blur = 0.25
resize = 0.10
gaussian_noise = 0.35
color_jitter = 0.10
center_crop = 0.10

[curriculum.stage2]
epochs = [4, 7]
jpeg_quality = [70, 50]
name = "single_transform_medium"
gaussian_blur_sigma = [1.0, 2.0]
resize_scale = [0.25, 0.5]
gaussian_noise_sigma = [0.05, 0.10]
center_crop_fraction = [0.8]
color_jitter_strength = [0.2]

[curriculum.stage2.transform_weights]
jpeg = 0.10
gaussian_blur = 0.25
resize = 0.10
gaussian_noise = 0.35
color_jitter = 0.10
center_crop = 0.10

[curriculum.stage3]
epochs = [8, 9]
name = "single_transform_hard"
jpeg_quality = [50, 30]
gaussian_blur_sigma = [1.0, 2.0]
resize_scale = [0.25]
gaussian_noise_sigma = [0.05, 0.10]
center_crop_fraction = [0.8]
color_jitter_strength = [0.2]

[curriculum.stage3.transform_weights]
jpeg = 0.10
gaussian_blur = 0.25
resize = 0.10
gaussian_noise = 0.35
color_jitter = 0.10
center_crop = 0.10
